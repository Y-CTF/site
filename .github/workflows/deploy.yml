name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v7
              with:
                  # The colophon names the tag the site was built from, and
                  # `git describe` needs the history and the tags to find one.
                  fetch-depth: 0

            - uses: cargo-bins/cargo-binstall@v1.23.0
            - run: cargo binstall -y baudelaire

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Restore the incremental cache
              uses: actions/cache@v6
              with:
                  path: .baudelaire
                  key: baudelaire-${{ hashFiles('config.kdl', 'content/**', 'templates/**', 'styles/**') }}
                  restore-keys: baudelaire-

            - run: baudelaire build --strict

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: public

            - id: deployment
              uses: actions/deploy-pages@v5
